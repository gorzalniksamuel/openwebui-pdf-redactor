# Optional: a hardened Open Terminal with the redactor built in (alternative to setup_openterminal.py).
# Build context is the open-terminal/ folder:   docker compose -f docker/docker-compose.yml up -d --build
# Put OPEN_TERMINAL_API_KEY=<long random string> into docker/.env first (openssl rand -hex 32).
name: pdf-redactor-terminal
services:
  terminal:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: pdf-redactor-terminal:latest
    container_name: pdf-redactor-terminal
    restart: unless-stopped
    env_file: .env
    environment:
      REDACT_RETENTION_MIN: "60"     # uploads/outputs are deleted 60 min after their last change (0 = never)
      TMPDIR: /tmp
      # REDACT_FULL_APP_URL: "https://redactor.example.com"   # optional link shown for difficult scans
      # REDACT_TERMINAL_SKILL: "1"   # also serve the skill from the terminal (normally it is a workspace skill)
      OPEN_TERMINAL_EXECUTE_DESCRIPTION: >-
        PDF redaction: the `redact` CLI is installed (redact extract FILE.pdf; redact apply FILE.pdf --terms "X"
        [--label "Auftragsnummer"] [--builtin IBAN|EMAIL|PHONE|DATE]). Follow ~/AGENTS.md.
    ports:
      - "8000:8000"                  # restrict with a firewall: only the Open WebUI server needs it
    user: "1000:1000"
    working_dir: /home/user
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - home:/home/user
    tmpfs:
      - /tmp:size=512m,uid=1000,gid=1000,mode=1777   # scratch stays in RAM
    cpus: 4
    mem_limit: 2g
    pids_limit: 512
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  home:
